# Mission choice changes presentation and interpretation, never dimension labels or ranking.
human_base:
  order: [terrain, thermal, illumination, water_ice, surface_material, dust_wind, aridity_vegetation]
  rationale:
    terrain: "Terrain is {label}; that shapes construction and access planning."
    thermal: "Thermal conditions are {label}; habitat protection depends on them."
    illumination: "Illumination is {label}; power and shelter plans must account for it."
    water_ice: "Water and ice evidence is {label}; resource assumptions remain limited."
    surface_material: "Surface material is {label}; local construction feedstock is uncertain."
    dust_wind: "Dust and wind are {label}; exposed systems need protection."
    aridity_vegetation: "Earth-side aridity is {label}; this affects analog field testing."
  impacts:
    terrain: {Similar: advantage, Partly: neutral, Different: risk}
    thermal: {Similar: advantage, Partly: neutral, Earth cannot reproduce: risk}
    illumination: {Earth cannot reproduce: risk, Not applicable: neutral}
    water_ice: {Shared evidence type: opportunity, Different: risk}
    surface_material: {Overlap: opportunity, No overlap: neutral}
    dust_wind: {Partly: risk}
    aridity_vegetation: {Good: advantage, Moderate: neutral, Poor: risk}
