name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt -r engine/requirements.txt
      - run: python -m pytest validation/test_similarity.py engine/tests backend
      - run: python -c "from backend.app.main import app; from engine.similarity import rank_candidates; import discovery.global_grid"
